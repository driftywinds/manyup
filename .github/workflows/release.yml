name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            name: manyup-windows-amd64
            portable: false
          - goos: windows
            goarch: amd64
            suffix: .exe
            name: manyup-windows-amd64-portable
            portable: true
          - goos: linux
            goarch: amd64
            suffix: ""
            name: manyup-linux-amd64
            portable: false
          - goos: linux
            goarch: arm64
            suffix: ""
            name: manyup-linux-arm64
            portable: false
          - goos: darwin
            goarch: amd64
            suffix: ""
            name: manyup-darwin-amd64
            portable: false
          - goos: darwin
            goarch: arm64
            suffix: ""
            name: manyup-darwin-arm64
            portable: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ldflags="-s -w -X main.version=${{ inputs.tag }}"
          if [ "${{ matrix.portable }}" = "true" ]; then
            ldflags="$ldflags -X github.com/driftywinds/manyup/internal/config.IsPortable=true"
          fi
          go build -trimpath -ldflags="$ldflags" -o "${{ matrix.name }}${{ matrix.suffix }}" .
          echo "BINARY=${{ matrix.name }}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Zip portable build
        if: matrix.portable
        run: zip -j "${{ matrix.name }}.zip" "${{ matrix.name }}${{ matrix.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}${{ matrix.suffix }}
            ${{ matrix.portable && format('{0}.zip', matrix.name) || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: manyup ${{ inputs.tag }}
          generate_release_notes: true
          files: binaries/*
